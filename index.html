<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>友善校園管理平台</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family:'Microsoft JhengHei','微軟正黑體',sans-serif; }
  .tab-active { border-bottom:3px solid #3b82f6; color:#3b82f6; font-weight:600; }
  .spin { animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .badge-red    { background:#fee2e2; color:#dc2626; }
  .badge-yellow { background:#fef9c3; color:#ca8a04; }
  .badge-green  { background:#dcfce7; color:#16a34a; }
  .badge-blue   { background:#dbeafe; color:#1d4ed8; }
  .badge-purple { background:#f3e8ff; color:#7e22ce; }
  .badge-gray   { background:#f3f4f6; color:#6b7280; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- 載入遮罩 -->
<div id="overlay" class="hidden fixed inset-0 bg-white/75 z-50 flex items-center justify-center">
  <div class="text-center">
    <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full spin mx-auto mb-3"></div>
    <div class="text-gray-600 text-sm" id="overlayText">處理中...</div>
  </div>
</div>

<!-- 未開通頁面 -->
<div id="notFoundPage" class="hidden min-h-screen flex items-center justify-center bg-gray-50">
  <div class="bg-white rounded-2xl shadow-xl p-10 max-w-md text-center">
    <div class="text-5xl mb-4" id="nfIcon">🔒</div>
    <h2 class="text-xl font-bold text-gray-800 mb-2" id="nfTitle">帳號尚未開通</h2>
    <p class="text-gray-500 text-sm mb-4" id="nfMsg"></p>
    <p class="text-xs text-gray-400">登入帳號：<span id="nfEmail" class="font-mono"></span></p>
  </div>
</div>

<!-- 主應用 -->
<div id="mainApp" class="hidden">
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-14">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🌿</span>
        <span class="font-bold text-gray-800 text-lg">友善校園管理平台</span>
        <span id="roleTag" class="text-xs rounded-full px-2 py-0.5 ml-1"></span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-sm text-gray-500 hidden md:block" id="userNameTag"></span>
        <a id="lineAddBtn" href="#" target="_blank" class="hidden text-sm font-medium text-white rounded-lg px-3 py-1 transition" style="background:#06C755">加入LINE助手</a>
        <button onclick="loadAll()" class="text-sm text-gray-500 hover:text-blue-500 border border-gray-200 rounded-lg px-3 py-1">↻ 重新整理</button>
      </div>
    </div>
    <div class="max-w-7xl mx-auto px-4 flex border-t border-gray-100 overflow-x-auto" id="tabBar"></div>
  </header>
  <main class="max-w-7xl mx-auto px-4 py-6" id="mainContent"></main>
</div>

<!-- 彈出視窗（通用） -->
<div id="modalBg" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto" id="modalBox"></div>
</div>

<script>
// ══════ 狀態 ══════
var U = null; // 使用者資訊
var summary = null, honorRoll = [], myData = null;
var honorStudents = [], selectedHonorStudent = null, honorMode = 'select';
var adminData = null;
var myFeedbacks = [];
var currentTab = '';

// ══════ 工具 ══════
function showLoad(t){ document.getElementById('overlayText').textContent=t||'處理中...'; document.getElementById('overlay').classList.remove('hidden'); }
function hideLoad(){ document.getElementById('overlay').classList.add('hidden'); }
function toast(msg,err){
  var d=document.createElement('div');
  d.className='fixed bottom-5 right-5 z-50 px-5 py-3 rounded-xl shadow-lg text-white text-sm font-medium transition-all '+(err?'bg-red-500':'bg-green-600');
  d.textContent=msg; document.body.appendChild(d);
  setTimeout(function(){d.style.opacity='0'; setTimeout(function(){d.remove();},300);},2800);
}
function openModal(html){ document.getElementById('modalBox').innerHTML=html; document.getElementById('modalBg').classList.remove('hidden'); }
function closeModal(){ document.getElementById('modalBg').classList.add('hidden'); }
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });

function remaining(s){ return Math.max(0, s.total - s.done); }
function statusBadge(s){
  var r=remaining(s);
  if(s.status==='已完成'||r<=0) return '<span class="badge-green text-xs rounded-full px-2 py-0.5">已完成</span>';
  if(r>=3) return '<span class="badge-red text-xs rounded-full px-2 py-0.5">剩 '+r+' 次</span>';
  return '<span class="badge-yellow text-xs rounded-full px-2 py-0.5">剩 '+r+' 次</span>';
}

// ══════ 初始化 ══════
window.onload = function(){
  showLoad('識別身份中...');
  google.script.run
    .withSuccessHandler(onUser)
    .withFailureHandler(function(e){ hideLoad(); toast('連線失敗：'+e.message, true); })
    .getUserInfo();
};

function onUser(info){
  U = info;
  if(!info.found){
    hideLoad();
    document.getElementById('notFoundPage').classList.remove('hidden');
    document.getElementById('nfEmail').textContent = info.email||'';
    if(info.disabled){
      document.getElementById('nfIcon').textContent='🚫';
      document.getElementById('nfTitle').textContent='帳號已停用';
      document.getElementById('nfMsg').textContent='請聯絡管理員重新開通。';
    } else {
      document.getElementById('nfMsg').textContent='請聯絡管理員新增您的帳號後再試。';
    }
    return;
  }
  document.getElementById('mainApp').classList.remove('hidden');
  var tag=document.getElementById('roleTag');
  document.getElementById('userNameTag').textContent=info.name;
  if(info.role==='admin'){
    tag.textContent='管理員'; tag.className='text-xs rounded-full px-2 py-0.5 ml-1 bg-purple-100 text-purple-700';
  } else if(info.myClass){
    tag.textContent=info.myClass+' 班級老師'; tag.className='text-xs rounded-full px-2 py-0.5 ml-1 bg-blue-100 text-blue-700';
  } else {
    tag.textContent='教師'; tag.className='text-xs rounded-full px-2 py-0.5 ml-1 bg-gray-100 text-gray-600';
  }
  if(info.lineBotId || info.lineLiffId){
    var lineBtn=document.getElementById('lineAddBtn');
    lineBtn.classList.remove('hidden');
    lineBtn.onclick=function(e){
      e.preventDefault();
      if(info.lineLiffId){
        showLoad('準備綁定連結...');
        google.script.run
          .withSuccessHandler(function(r){
            hideLoad();
            if(r && r.success && r.liffUrl){
              window.open(r.liffUrl,'_blank');
            } else if(info.lineBotId){
              window.open('https://line.me/R/ti/p/'+info.lineBotId,'_blank');
            } else {
              toast('請聯絡管理員設定 LIFF ID',true);
            }
          })
          .withFailureHandler(function(){ hideLoad(); toast('連線失敗',true); })
          .generateBindToken(U.role);
      } else {
        window.open('https://line.me/R/ti/p/'+info.lineBotId,'_blank');
      }
    };
  }
  buildTabs();
  loadAll();
}

// ══════ 資料載入 ══════
function loadAll(){
  showLoad('載入資料...');
  var done=0, total=2;
  function check(){ if(++done>=total){ hideLoad(); renderTab(); } }

  google.script.run
    .withSuccessHandler(function(d){ summary=d; check(); })
    .withFailureHandler(function(){ check(); })
    .getSchoolSummary();

  google.script.run
    .withSuccessHandler(function(d){ honorRoll=d; check(); })
    .withFailureHandler(function(){ check(); })
    .getHonorRoll();

  if(U.myClass){
    total++;
    google.script.run
      .withSuccessHandler(function(d){ myData=d; check(); })
      .withFailureHandler(function(){ check(); })
      .getMyClassData(U.myClass);
  }

  if(U.role==='admin'){
    total++;
    google.script.run
      .withSuccessHandler(function(d){ adminData=d; check(); })
      .withFailureHandler(function(){ check(); })
      .getAdminData();
  }

  total++;
  google.script.run
    .withSuccessHandler(function(d){ myFeedbacks=d; check(); })
    .withFailureHandler(function(){ check(); })
    .getMyFeedbacks(U.email);
}

// ══════ 分頁 ══════
function buildTabs(){
  var tabs = [
    ['summary','📊 全校概況'],
    ['areas','🗺️ 待清理區域'],
    ['honor','🏆 表揚名單'],
    ['feedback','💬 意見回饋']
  ];
  if(U.myClass) tabs.splice(1,0,['myClass','🏫 我的班級']);
  if(U.role==='admin') tabs = tabs.concat([
    ['adminStudents','👥 學生管理'],
    ['adminTeachers','👩‍🏫 帳號管理'],
    ['adminFeedback','📬 回饋管理']
  ]);
  document.getElementById('tabBar').innerHTML = tabs.map(function(t){
    return '<button onclick="sw(\''+t[0]+'\')" id="tab-'+t[0]+'" class="tab-btn px-4 py-3 text-sm text-gray-500 hover:text-blue-500 whitespace-nowrap transition">'+t[1]+'</button>';
  }).join('');
  sw(U.myClass ? 'myClass' : 'summary');
}

function sw(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('tab-active'); });
  var el=document.getElementById('tab-'+tab); if(el) el.classList.add('tab-active');
  renderTab();
}

function renderTab(){
  if(currentTab==='summary') renderSummary();
  else if(currentTab==='myClass') renderMyClass();
  else if(currentTab==='areas') renderAreas();
  else if(currentTab==='honor') renderHonor();
  else if(currentTab==='feedback') renderFeedback();
  else if(currentTab==='adminStudents') renderAdminStudents();
  else if(currentTab==='adminTeachers') renderAdminTeachers();
  else if(currentTab==='adminFeedback') renderAdminFeedback();
}

// ══════ 全校概況（公開去識別化）══════
function renderSummary(){
  if(!summary){ document.getElementById('mainContent').innerHTML='<div class="text-gray-400 text-center py-20">載入中...</div>'; return; }
  var s=summary;
  var byClassRows = Object.entries(s.byClass||{}).sort(function(a,b){ return b[1].times-a[1].times; }).map(function(e){
    return '<tr class="border-b border-gray-50 hover:bg-gray-50"><td class="px-4 py-2 font-medium">'+e[0]+'</td><td class="px-4 py-2 text-center">'+e[1].count+'</td><td class="px-4 py-2 text-center">'+e[1].times+'</td></tr>';
  }).join('');

  document.getElementById('mainContent').innerHTML =
    '<h2 class="text-xl font-bold text-gray-800 mb-5">全校環教概況</h2>'+

    '<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">'+
      stat('需完成環教', s.totalNeedEnvEd+'<span class="text-lg ml-1">位</span>', '#ef4444')+
      stat('合計剩餘次數', s.totalRemainingTimes+'<span class="text-lg ml-1">次</span>', '#8b5cf6')+
      stat('已完成學生', s.completedCount+'<span class="text-lg ml-1">位</span>', '#22c55e')+
      stat('待清理區域', (s.pendingAreas||[]).length+'<span class="text-lg ml-1">個</span>', '#f97316')+
    '</div>'+

    '<div class="grid md:grid-cols-2 gap-4">'+
      '<div class="bg-white rounded-xl shadow-sm p-5">'+
        '<h3 class="font-semibold text-gray-700 mb-3">📊 各班環教統計</h3>'+
        (byClassRows ?
          '<table class="w-full text-sm"><thead class="bg-gray-50"><tr>'+
          '<th class="text-left px-4 py-2 text-gray-500 font-medium">班級</th>'+
          '<th class="text-center px-4 py-2 text-gray-500 font-medium">人數</th>'+
          '<th class="text-center px-4 py-2 text-gray-500 font-medium">剩餘次數</th>'+
          '</tr></thead><tbody>'+byClassRows+'</tbody></table>' :
          '<div class="text-gray-400 text-sm py-4 text-center">目前無需完成環教的學生</div>')+
      '</div>'+
      '<div class="bg-white rounded-xl shadow-sm p-5">'+
        '<div class="flex justify-between items-center mb-3">'+
          '<h3 class="font-semibold text-gray-700">🗺️ 待清理區域</h3>'+
          '<button onclick="sw(\'areas\')" class="text-blue-500 text-sm hover:underline">查看全部</button>'+
        '</div>'+
        ((s.pendingAreas||[]).length ?
          (s.pendingAreas||[]).slice(0,5).map(function(a){
            return '<div class="flex items-center justify-between py-2 border-b border-gray-50 last:border-0">'+
              '<div><span class="font-medium text-sm">'+a.area+(a.location?' · '+a.location:'')+'</span></div>'+
              '<div class="flex gap-2 text-xs">'+
                (a.envEdCount?'<span class="badge-blue rounded-full px-2 py-0.5">環教 '+a.envEdCount+'人</span>':'')+
                (a.volunteerCount?'<span class="badge-green rounded-full px-2 py-0.5">自願 '+a.volunteerCount+'人</span>':'')+
                '<span class="'+(a.status==='待指派'?'badge-yellow':'badge-blue')+' rounded-full px-2 py-0.5">'+a.status+'</span>'+
              '</div></div>';
          }).join('') :
          '<div class="text-gray-400 text-sm py-4 text-center">目前沒有待清理區域 🎉</div>')+
      '</div>'+
    '</div>';
}

function stat(label, val, color){
  return '<div class="bg-white rounded-xl shadow-sm p-5 border-l-4" style="border-color:'+color+'">'+
    '<div class="text-2xl font-bold" style="color:'+color+'">'+val+'</div>'+
    '<div class="text-sm text-gray-500 mt-1">'+label+'</div></div>';
}

// ══════ 我的班級（班級老師） ══════
function renderMyClass(){
  if(!myData){ document.getElementById('mainContent').innerHTML='<div class="text-gray-400 text-center py-20">載入中...</div>'; return; }
  var students=myData.students||[], regs=myData.registrations||[];
  var need=students.filter(function(s){ return s.status==='進行中'&&s.done<s.total; });
  var totalLeft=need.reduce(function(sum,s){ return sum+remaining(s); },0);
  var pendingRegs=regs.filter(function(r){ return !r.completed; });

  document.getElementById('mainContent').innerHTML =
    '<h2 class="text-xl font-bold text-gray-800 mb-4">我的班級：'+U.myClass+'</h2>'+

    '<div class="grid grid-cols-3 gap-4 mb-5">'+
      stat('班上學生總數', students.length+'', '#6366f1')+
      stat('需完成環教', need.length+'', '#ef4444')+
      stat('班上剩餘次數', totalLeft+'', '#8b5cf6')+
    '</div>'+

    '<div class="bg-white rounded-xl shadow-sm overflow-x-auto mb-5">'+
      '<div class="flex items-center justify-between px-5 py-4 border-b border-gray-50">'+
        '<h3 class="font-semibold text-gray-700">班上學生環教狀況</h3>'+
      '</div>'+
      '<table class="w-full text-sm">'+
        '<thead class="bg-gray-50"><tr>'+
          '<th class="text-left px-4 py-3 text-gray-500 font-medium">姓名</th>'+
          '<th class="text-center px-4 py-3 text-gray-500 font-medium">進度</th>'+
          '<th class="text-center px-4 py-3 text-gray-500 font-medium">剩餘次數</th>'+
          '<th class="text-center px-4 py-3 text-gray-500 font-medium">狀態</th>'+
          '<th class="text-left px-4 py-3 text-gray-500 font-medium">備註</th>'+
        '</tr></thead>'+
        '<tbody>'+(students.length ? students.map(function(s){
          var sc={'進行中':'badge-blue','已完成':'badge-green','暫停':'badge-gray','自願服務':'badge-purple'}[s.status]||'badge-gray';
          return '<tr class="border-b border-gray-50 hover:bg-gray-50">'+
            '<td class="px-4 py-3 font-medium">'+s.name+'</td>'+
            '<td class="px-4 py-3 text-center text-gray-600">'+s.done+'/'+s.total+'</td>'+
            '<td class="px-4 py-3 text-center">'+statusBadge(s)+'</td>'+
            '<td class="px-4 py-3 text-center"><span class="text-xs rounded-full px-2 py-0.5 '+sc+'">'+s.status+'</span></td>'+
            '<td class="px-4 py-3 text-gray-400 text-xs">'+(s.note||'—')+'</td>'+
          '</tr>';
        }).join('') : '<tr><td colspan="5" class="text-center py-10 text-gray-400">班上尚無學生資料</td></tr>')+
        '</tbody></table>'+
    '</div>'+

    (pendingRegs.length ?
      '<div class="bg-white rounded-xl shadow-sm p-5">'+
        '<h3 class="font-semibold text-gray-700 mb-3">班上待完成的打掃登記</h3>'+
        '<div class="space-y-3">'+
          pendingRegs.map(function(r){
            return '<div class="flex items-center justify-between bg-gray-50 rounded-lg px-4 py-3">'+
              '<div>'+
                '<span class="font-medium">'+r.studentName+'</span>'+
                '<span class="text-gray-400 text-xs ml-2">'+r.areaName+'</span>'+
                '<span class="ml-2 text-xs '+(r.type==='環教'?'badge-blue':'badge-purple')+' rounded-full px-2 py-0.5">'+r.type+'</span>'+
              '</div>'+
              '<div class="flex gap-2">'+
                '<button onclick="doComplete(\''+r.id+'\')" class="text-xs bg-green-600 hover:bg-green-700 text-white rounded-lg px-3 py-1 transition">確認完成</button>'+
                '<button onclick="doCancel(\''+r.id+'\')" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-600 rounded-lg px-3 py-1 transition">取消</button>'+
              '</div>'+
            '</div>';
          }).join('')+
        '</div>'+
      '</div>' : '');
}

// ══════ 待清理區域 ══════
function renderAreas(){
  if(!summary){ document.getElementById('mainContent').innerHTML='<div class="text-gray-400 text-center py-20">載入中...</div>'; return; }
  var areas=summary.pendingAreas||[];

  document.getElementById('mainContent').innerHTML =
    '<div class="flex items-center justify-between mb-5">'+
      '<h2 class="text-xl font-bold text-gray-800">待清理區域</h2>'+
      '<button onclick="showReportArea()" class="bg-orange-500 hover:bg-orange-600 text-white rounded-lg px-4 py-2 text-sm font-medium transition">+ 通報新區域</button>'+
    '</div>'+
    (areas.length ?
      '<div class="space-y-4">'+areas.map(areaCard).join('')+'</div>' :
      '<div class="bg-white rounded-xl shadow-sm p-12 text-center text-gray-400"><div class="text-4xl mb-3">🎉</div>目前沒有待清理區域</div>');
}

function areaCard(a){
  var statusColor={'待指派':'badge-yellow','進行中':'badge-blue','已完成':'badge-green'}[a.status]||'badge-gray';
  return '<div class="bg-white rounded-xl shadow-sm p-5">'+
    '<div class="flex items-start justify-between mb-3">'+
      '<div>'+
        '<div class="flex items-center gap-2 mb-1">'+
          '<span class="font-semibold text-gray-800">'+a.area+(a.location?' · <span class="font-normal text-gray-500">'+a.location+'</span>':'')+'</span>'+
          '<span class="text-xs rounded-full px-2 py-0.5 '+statusColor+'">'+a.status+'</span>'+
        '</div>'+
        (a.desc?'<p class="text-sm text-gray-500">'+a.desc+'</p>':'')+
        '<p class="text-xs text-gray-400 mt-1">通報：'+a.teacher+' · '+a.createdAt+(a.deadline?' · 期望 '+a.deadline:'')+'</p>'+
      '</div>'+
      '<div class="text-right shrink-0 ml-4">'+
        (a.envEdCount?'<div class="text-xs badge-blue rounded-full px-2 py-0.5 mb-1">環教已登記 '+a.envEdCount+' 人</div>':'')+
        (a.volunteerCount?'<div class="text-xs badge-green rounded-full px-2 py-0.5">自願已登記 '+a.volunteerCount+' 人</div>':'')+
      '</div>'+
    '</div>'+
    (a.status!=='已完成'?
      '<div class="flex gap-2 mt-3 pt-3 border-t border-gray-50">'+
        '<button onclick="showEnvEdModal(\''+a.id+'\',\''+a.area+(a.location?'·'+a.location:'')+'\')"\n          class="flex-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2 text-sm font-medium transition">🎓 環教登記</button>'+
        '<button onclick="showVolunteerModal(\''+a.id+'\',\''+a.area+(a.location?'·'+a.location:'')+'\')"\n          class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg py-2 text-sm font-medium transition">🌟 自願登記</button>'+
      '</div>' :
      '')+
  '</div>';
}

// ══════ 通報新區域 ══════
function showReportArea(){
  var today=new Date().toISOString().split('T')[0];
  openModal(
    '<div class="p-6">'+
    '<div class="flex justify-between items-center mb-4">'+
      '<h3 class="font-bold text-lg text-gray-800">通報待清理區域</h3>'+
      '<button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl">×</button>'+
    '</div>'+
    '<div class="space-y-3">'+
      '<div class="grid grid-cols-2 gap-3">'+
        '<div><label class="text-sm text-gray-600">通報老師 *</label>'+
          '<input id="ra-teacher" value="'+U.name+'" class="inp mt-0.5"></div>'+
        '<div><label class="text-sm text-gray-600">區域 *</label>'+
          '<select id="ra-area" class="inp mt-0.5">'+
            ['操場','走廊','餐廳','廁所','花圃','教室','校門口','其他'].map(function(o){ return '<option>'+o+'</option>'; }).join('')+
          '</select></div>'+
        '<div><label class="text-sm text-gray-600">詳細地點</label>'+
          '<input id="ra-loc" placeholder="如：東側球場" class="inp mt-0.5"></div>'+
        '<div><label class="text-sm text-gray-600">預估清理時間</label>'+

function searchEnvEd(){
  var kw=document.getElementById('ee-search').value.trim();
  if(!kw){ document.getElementById('ee-results').innerHTML=''; return; }
  google.script.run
    .withSuccessHandler(function(list){
      var el=document.getElementById('ee-results');
      if(!list.length){ el.innerHTML='<div class="text-sm text-gray-400 text-center py-2">找不到符合的學生</div>'; return; }
      el.innerHTML=list.slice(0,8).map(function(s){
        var sel=envSelected.some(function(x){ return x.id===s.id; });
        return '<div class="flex items-center justify-between bg-gray-50 rounded-lg px-3 py-2">'+
          '<div><span class="font-medium text-sm">'+s.name+'</span>'+
            '<span class="text-gray-400 text-xs ml-2">'+s.cls+'</span>'+
            '<span class="badge-red text-xs rounded-full px-2 py-0.5 ml-2">剩 '+s.remaining+' 次</span>'+
          '</div>'+
          '<button onclick="toggleEnvEdStudent(\''+s.id+'\',\''+s.name+'\',\''+s.cls+'\',\''+s.remaining+'\')" class="text-xs '+(sel?'bg-red-100 text-red-700':'bg-blue-100 text-blue-700')+' rounded px-2 py-1">'+(sel?'取消選擇':'選擇')+'</button>'+
        '</div>';
      }).join('');
    })
    .searchEnvEdStudents(kw);
}

function toggleEnvEdStudent(id,name,cls,rem){
  var idx=envSelected.findIndex(function(x){ return x.id===id; });
  if(idx>=0) envSelected.splice(idx,1);
  else envSelected.push({id:id,name:name,cls:cls});
  searchEnvEd();
  var selEl=document.getElementById('ee-selected');
  var listEl=document.getElementById('ee-selected-list');
  if(!envSelected.length){ selEl.classList.add('hidden'); return; }
  selEl.classList.remove('hidden');
  listEl.innerHTML=envSelected.map(function(s){
    return '<span class="badge-blue text-xs rounded-full px-2 py-1">'+s.name+' ('+s.cls+')</span>';
  }).join('');
}

function doEnvEd(areaId, areaName){
  if(!envSelected.length){ toast('請選擇至少一位學生',true); return; }
  var teacher=document.getElementById('ee-teacher').value.trim();
  if(!teacher){ toast('請填寫帶隊老師',true); return; }
  showLoad('登記中...');
  google.script.run
    .withSuccessHandler(function(r){ hideLoad(); closeModal(); if(r.success){ toast('環教登記成功！'); loadAll(); } })
    .withFailureHandler(function(){ hideLoad(); toast('登記失敗',true); })
    .registerEnvEd(areaId, areaName, teacher, envSelected);
}

function switchHonorMode(mode){
  honorMode=mode;
  selectedHonorStudent=null;
  var isSel=(mode==='select');
  document.getElementById('mh-sel-sec').classList.toggle('hidden',!isSel);
  document.getElementById('mh-man-sec').classList.toggle('hidden',isSel);
  document.getElementById('mh-btn-sel').className='flex-1 text-sm py-1.5 rounded-md transition '+(isSel?'bg-white shadow text-emerald-700 font-medium':'text-gray-500');
  document.getElementById('mh-btn-man').className='flex-1 text-sm py-1.5 rounded-md transition '+(!isSel?'bg-white shadow text-emerald-700 font-medium':'text-gray-500');
}

function filterHonorStudents(){
  var kw=document.getElementById('mh-search').value.toLowerCase();
  var filtered=honorStudents.filter(function(s){ return !kw||s.name.includes(kw)||s.cls.toLowerCase().includes(kw); });
  renderHonorStudentList(filtered);
}

function renderHonorStudentList(list){
  var el=document.getElementById('mh-list');
  if(!el) return;
  if(!list.length){
    el.innerHTML='<div class="text-gray-400 text-sm text-center py-3">查無學生</div>';
    return;
  }
  el.innerHTML=list.slice(0,100).map(function(s){
    return '<div class="flex items-center justify-between px-3 py-2 hover:bg-emerald-50 cursor-pointer border-b border-gray-100 last:border-0" onclick="selectHonorStudent(\''+s.id+'\',\''+s.name+'\',\''+s.cls+'\')">'+
      '<span class="text-sm font-medium">'+s.name+'</span>'+
      '<span class="text-xs text-gray-500">'+s.cls+'</span>'+
    '</div>';
  }).join('');
}

function selectHonorStudent(id,name,cls){
  selectedHonorStudent={id:id,name:name,cls:cls};
  document.getElementById('mh-picked-text').textContent=name+'（'+cls+'）';
  document.getElementById('mh-picked').classList.remove('hidden');
}

function doManualHonor(){
  var reason=document.getElementById('mh-reason').value.trim();
  var teacher=document.getElementById('mh-teacher').value.trim();
  var studentId,studentName,cls;
  if(honorMode==='select'){
    if(!selectedHonorStudent){ toast('請先從清單選擇學生',true); return; }
    studentId=selectedHonorStudent.id;
    studentName=selectedHonorStudent.name;
    cls=selectedHonorStudent.cls;
  } else {
    studentName=(document.getElementById('mh-name').value||'').trim();
    cls=(document.getElementById('mh-cls').value||'').trim();
    studentId='';
    if(!studentName||!cls){ toast('請填寫學生姓名和班級',true); return; }
  }
  if(!reason){ toast('請填寫表揚事由',true); return; }
  showLoad('新增中...');
  google.script.run
    .withSuccessHandler(function(r){ hideLoad(); closeModal(); if(r.success){ toast('已新增至表揚名單！'); loadAll(); } else toast('新增失敗',true); })
    .withFailureHandler(function(){ hideLoad(); toast('新增失敗',true); })
    .addManualHonorRecord({studentId:studentId,studentName:studentName,cls:cls,reason:reason,teacherName:teacher});
}

  showLoad('送出中...');

    .withSuccessHandler(function(r){ hideLoad(); if(r.success){ toast('已送出，謝謝您的意見！'); loadAll(); } })
    .withFailureHandler(function(){ hideLoad(); toast('送出失敗',true); })
    .submitFeedback({
      email: U.email,
      submitterName: U.name,
      anonymous: document.getElementById('fb-anon').checked,
      category: document.getElementById('fb-cat').value,
      title: title,
      content: content
    });
}

// ══════ 管理員：學生管理 ══════
function renderAdminStudents(){
  if(!adminData){ document.getElementById('mainContent').innerHTML='<div class="text-gray-400 text-center py-20">載入中...</div>'; return; }
  var students=adminData.students||[];
  document.getElementById('mainContent').innerHTML =
    '<div class="flex items-center justify-between mb-4">'+
      '<h2 class="text-xl font-bold text-gray-800">全校學生管理</h2>'+
      '<div class="flex gap-2">'+
        '<input id="as-q" type="text" placeholder="搜尋姓名/班級" oninput="filterAdminStudents()" class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">'+
        '<button onclick="showStudentForm(null)" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 py-1.5 text-sm transition">+ 新增</button>'+
      '</div>'+
    '</div>'+
    '<div id="as-form-area"></div>'+
    '<div class="bg-white rounded-xl shadow-sm overflow-x-auto">'+
      '<table class="w-full text-sm">'+
        '<thead class="bg-gray-50 border-b"><tr>'+
          '<th class="text-left px-4 py-3 text-gray-500 font-medium">姓名</th>'+
          '<th class="text-left px-4 py-3 text-gray-500 font-medium">班級</th>'+
          '<th class="text-center px-4 py-3 text-gray-500 font-medium">進度</th>'+
          '<th class="text-center px-4 py-3 text-gray-500 font-medium">剩餘</th>'+
          '<th class="text-center px-4 py-3 text-gray-500 font-medium">狀態</th>'+

        '</tr></thead>'+

      '<div id="as-empty" class="hidden text-center py-12 text-gray-400"><div class="text-3xl mb-2">👥</div>尚無學生資料</div>'+
    '</div>';
  filterAdminStudents();
}

function filterAdminStudents(){
  var q=(document.getElementById('as-q')?document.getElementById('as-q').value:'').toLowerCase();
  var list=(adminData.students||[]).filter(function(s){ return !q||s.name.includes(q)||s.cls.toLowerCase().includes(q); });
  var tbody=document.getElementById('as-tbody'), empty=document.getElementById('as-empty');
  if(!tbody) return;
  if(!list.length){ tbody.innerHTML=''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  var SC={'進行中':'badge-blue','已完成':'badge-green','暫停':'badge-gray','自願服務':'badge-purple'};
  tbody.innerHTML=list.map(function(s){
    var c=SC[s.status]||'badge-gray';
    return '<tr class="border-b border-gray-50 hover:bg-gray-50">'+
      '<td class="px-4 py-3 font-medium">'+s.name+'</td>'+
      '<td class="px-4 py-3 text-gray-600">'+s.cls+'</td>'+
      '<td class="px-4 py-3 text-center text-gray-600">'+s.done+'/'+s.total+'</td>'+
      '<td class="px-4 py-3 text-center">'+statusBadge(s)+'</td>'+
      '<td class="px-4 py-3 text-center"><span class="text-xs rounded-full px-2 py-0.5 '+c+'">'+s.status+'</span></td>'+
      '<td class="px-4 py-3 text-gray-600">'+(s.teacher||'—')+'</td>'+
      '<td class="px-4 py-3"><div class="flex gap-1">'+
        '<button onclick="showStudentForm(\''+s.id+'\')" class="text-xs badge-blue rounded px-2 py-1">編輯</button>'+
        '<button onclick="doDeleteStudent(\''+s.id+'\',\''+s.name+'\')" class="text-xs badge-red rounded px-2 py-1">刪除</button>'+
      '</div></td></tr>';
  }).join('');
}

var editStuId=null;
function showStudentForm(id){
  editStuId=id;
  var s=id?(adminData.students||[]).find(function(x){ return x.id===id; }):null;
  var GRADES=['1年級','2年級','3年級','4年級','5年級','6年級'];
  var ST=['進行中','已完成','暫停','自願服務'];
  var area=document.getElementById('as-form-area');
  area.innerHTML=
    '<div class="bg-blue-50 border border-blue-200 rounded-xl p-5 mb-4">'+
    '<h3 class="font-semibold text-blue-800 mb-3">'+(s?'編輯學生資料':'新增學生')+'</h3>'+
    '<div class="grid grid-cols-2 md:grid-cols-4 gap-3">'+
      mField('姓名 *','sf-name','input',s?s.name:'')+
      mField('班級 *','sf-cls','input',s?s.cls:'')+
      mSel('年級','sf-grade',GRADES,s?s.grade:'1年級')+
      mNum('需完成總次數','sf-total',s?s.total:5)+
      mNum('已完成次數','sf-done',s?s.done:0)+
      mSel('狀態','sf-status',ST,s?s.status:'進行中')+
      mField('通報老師','sf-teacher','input',s?s.teacher:'')+
    '</div>'+
    '<div class="mt-3"><label class="text-xs text-gray-600">備註</label>'+
      '<input id="sf-note" value="'+(s?s.note:'')+'" class="w-full border rounded px-2 py-1.5 text-sm mt-0.5 focus:outline-none focus:ring-1 focus:ring-blue-400"></div>'+
    '<div class="flex gap-2 mt-3">'+
      '<button onclick="doSaveStudent()" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-5 py-1.5 text-sm transition">儲存</button>'+
      '<button onclick="document.getElementById(\'as-form-area\').innerHTML=\'\'" class="border border-gray-200 text-gray-600 rounded-lg px-4 py-1.5 text-sm hover:bg-gray-50">取消</button>'+
    '</div></div>';
}

function mField(label,id,type,val){
  return '<div><label class="text-xs text-gray-600">'+label+'</label><input id="'+id+'" value="'+val+'" class="w-full border rounded px-2 py-1.5 text-sm mt-0.5 focus:outline-none focus:ring-1 focus:ring-blue-400"></div>';
}
function mSel(label,id,opts,sel){
  return '<div><label class="text-xs text-gray-600">'+label+'</label><select id="'+id+'" class="w-full border rounded px-2 py-1.5 text-sm mt-0.5 focus:outline-none focus:ring-1 focus:ring-blue-400">'+opts.map(function(o){ return '<option'+(o===sel?' selected':'')+'>'+o+'</option>'; }).join('')+'</select></div>';
}
function mNum(label,id,val){
  return '<div><label class="text-xs text-gray-600">'+label+'</label><input id="'+id+'" type="number" value="'+val+'" min="0" class="w-full border rounded px-2 py-1.5 text-sm mt-0.5 focus:outline-none focus:ring-1 focus:ring-blue-400"></div>';
}

function doSaveStudent(){
  var name=document.getElementById('sf-name').value.trim();
  var cls=document.getElementById('sf-cls').value.trim();
  if(!name||!cls){ toast('請填寫姓名和班級',true); return; }
  var s={
    id:editStuId||'', name:name, cls:cls,
    grade:document.getElementById('sf-grade').value,
    total:parseInt(document.getElementById('sf-total').value)||5,
    done:parseInt(document.getElementById('sf-done').value)||0,
    status:document.getElementById('sf-status').value,
    teacher:document.getElementById('sf-teacher').value.trim(),
    note:document.getElementById('sf-note').value.trim()
  };
  showLoad('儲存中...');
  google.script.run
    .withSuccessHandler(function(r){ hideLoad(); if(r.success){ toast('儲存成功'); document.getElementById('as-form-area').innerHTML=''; loadAll(); } else toast('失敗',true); })
    .withFailureHandler(function(){ hideLoad(); toast('錯誤',true); })
    [editStuId?'updateStudent':'addStudent'](s);
}

function doDeleteStudent(id, name){
  if(!confirm('確定要刪除「'+name+'」的資料嗎？')) return;
  showLoad('刪除中...');
  google.script.run
    .withSuccessHandler(function(){ hideLoad(); toast('已刪除'); loadAll(); })
    .withFailureHandler(function(){ hideLoad(); toast('錯誤',true); })
    .deleteStudent(id);
}

  document.getElementById('at-form-area').innerHTML=

      '<div><label class="text-xs text-gray-600">角色</label>'+

function doSaveTeacher(){
  var email=document.getElementById('tf-email').value.trim();
  var name=document.getElementById('tf-name').value.trim();
  if(!email||!name){ toast('請填寫帳號和姓名',true); return; }
  showLoad('儲存中...');
  google.script.run
    .withSuccessHandler(function(r){ hideLoad(); if(r.success){ toast('已'+(r.action==='added'?'新增':'更新')); document.getElementById('at-form-area').innerHTML=''; loadAll(); } })
    .withFailureHandler(function(){ hideLoad(); toast('錯誤',true); })
    .saveTeacher({
      email: email, name: name,
      role: document.getElementById('tf-role').value,
      myClass: document.getElementById('tf-cls').value.trim(),
      active: document.getElementById('tf-active').value === 'true'
    });
}

function doDeleteTeacher(email,name){
  if(!confirm('確定要刪除「'+name+'」的帳號嗎？')) return;
  showLoad('刪除中...');
  google.script.run
    .withSuccessHandler(function(){ hideLoad(); toast('已刪除'); loadAll(); })
    .withFailureHandler(function(){ hideLoad(); toast('錯誤',true); })
    .deleteTeacher(email);
}

// ══════ 管理員：回饋管理 ══════
function renderAdminFeedback(){
  if(!adminData){ document.getElementById('mainContent').innerHTML='<div class="text-gray-400 text-center py-20">載入中...</div>'; return; }
  var fbs=adminData.feedbacks||[];
  var SC={'待處理':'badge-yellow','處理中':'badge-blue','已回覆':'badge-green','已結案':'badge-gray'};
  document.getElementById('mainContent').innerHTML =
    '<h2 class="text-xl font-bold text-gray-800 mb-4">意見回饋管理</h2>'+
    (fbs.length ?
      '<div class="space-y-4">'+
        fbs.sort(function(a,b){ return a.processingStatus==='待處理'?-1:1; }).map(function(f){
          var sc=SC[f.processingStatus]||'badge-gray';
          return '<div class="bg-white rounded-xl shadow-sm p-5">'+
            '<div class="flex items-start justify-between mb-2">'+
              '<div>'+
                '<div class="flex items-center gap-2 mb-1">'+
                  '<span class="font-semibold text-gray-800">'+f.title+'</span>'+
                  '<span class="text-xs badge-gray rounded-full px-2 py-0.5">'+f.category+'</span>'+
                  '<span class="text-xs rounded-full px-2 py-0.5 '+sc+'">'+f.processingStatus+'</span>'+
                '</div>'+
                '<div class="text-xs text-gray-400">'+
                  (f.anonymous?'匿名提交':'提交者：'+f.submitterName)+' · '+f.submittedAt+
                '</div>'+
              '</div>'+
            '</div>'+
            '<p class="text-sm text-gray-600 bg-gray-50 rounded-lg px-4 py-3 mb-3">'+f.content+'</p>'+
            (f.reply?'<div class="bg-blue-50 rounded-lg px-4 py-2 text-sm text-blue-800 mb-3"><span class="font-medium">已回覆：</span>'+f.reply+'</div>':'')+
            '<div class="flex gap-2 flex-wrap">'+
              ['待處理','處理中','已回覆','已結案'].map(function(st){
                return '<button onclick="doUpdateFeedback(\''+f.id+'\',\''+st+'\')" class="text-xs border border-gray-200 '+(f.processingStatus===st?'bg-gray-100 font-semibold':'')+' rounded px-3 py-1 hover:bg-gray-50">'+st+'</button>';
              }).join('')+
              '<button onclick="showReplyModal(\''+f.id+'\')" class="text-xs bg-blue-100 hover:bg-blue-200 text-blue-700 rounded px-3 py-1">💬 回覆</button>'+
            '</div>'+
          '</div>';
        }).join('')+
      '</div>' :
      '<div class="bg-white rounded-xl shadow-sm p-12 text-center text-gray-400"><div class="text-4xl mb-3">💬</div>目前沒有意見回饋</div>');
}

function doUpdateFeedback(id, status){
  showLoad('更新中...');
  google.script.run
    .withSuccessHandler(function(r){ hideLoad(); if(r.success){ toast('狀態已更新'); loadAll(); } })
    .withFailureHandler(function(){ hideLoad(); toast('錯誤',true); })
    .replyFeedback(id, status, undefined);
}

function showReplyModal(id){
  var f=(adminData.feedbacks||[]).find(function(x){ return x.id===id; });
  openModal(
    '<div class="p-6">'+
    '<div class="flex justify-between items-center mb-4">'+
      '<h3 class="font-bold text-lg">💬 回覆意見</h3>'+
      '<button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl">×</button>'+
    '</div>'+
    '<p class="text-sm text-gray-600 bg-gray-50 rounded-lg p-3 mb-4">'+(f?f.content:'')+'</p>'+
    '<textarea id="reply-content" rows="4" placeholder="輸入回覆內容..." class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 mb-3">'+(f&&f.reply?f.reply:'')+'</textarea>'+
    '<div class="flex gap-2">'+
      '<button onclick="doReply(\''+id+'\')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2.5 text-sm font-medium transition">送出回覆</button>'+
      '<button onclick="closeModal()" class="px-5 border border-gray-200 text-gray-600 rounded-lg py-2.5 text-sm hover:bg-gray-50">取消</button>'+
    '</div></div>'
  );
}

function doReply(id){
  var reply=document.getElementById('reply-content').value.trim();
  if(!reply){ toast('請輸入回覆內容',true); return; }
  showLoad('送出中...');
  google.script.run
    .withSuccessHandler(function(r){ hideLoad(); closeModal(); if(r.success){ toast('回覆已送出'); loadAll(); } })
    .withFailureHandler(function(){ hideLoad(); toast('錯誤',true); })
    .replyFeedback(id, '已回覆', reply);
}
</script>
